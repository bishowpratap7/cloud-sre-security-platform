spring:
  application:
    name: orders-api
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

app:
  version: ${APP_VERSION:0.0.0-SNAPSHOT}
  jitter-ms: ${JITTER_MS:30}

logging:
  level:
    com.sreplatform: INFO
