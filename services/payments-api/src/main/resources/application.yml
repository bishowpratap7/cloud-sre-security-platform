spring:
  application:
    name: payments-api
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,ordersHealth
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: payments-api
    version: ${app.version}

app:
  version: ${APP_VERSION:0.0.0-SNAPSHOT}
  orders-url: ${DESTINATION_URL:http://localhost:8082}
  fault-defaults:
    error-rate: 40
    latency-ms: 3000
    cpu-seconds: 10
    cert-rate: 100

resilience4j.circuitbreaker:
  instances:
    orders:
      slidingWindowSize: 20
      minimumNumberOfCalls: 5
      failureRateThreshold: 50
      waitDurationInOpenState: 10s
      permittedNumberOfCallsInHalfOpenState: 3

resilience4j.retry:
  instances:
    orders:
      maxAttempts: 3
      waitDuration: 300ms
      enableExponentialBackoff: true
      exponentialBackoffMultiplier: 2

resilience4j.timelimiter:
  instances:
    orders:
      timeoutDuration: 5s

logging:
  level:
    com.sreplatform: INFO
    io.github.resilience4j: INFO
