groups:
  - name: slo.rules
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / on(service) sum by (service) (rate(http_server_requests_seconds_count[5m])) > 0.20
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "{{ $labels.service }} error rate above 20%"
          description: "{{ $labels.service }} error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 1.5
        for: 2m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "{{ $labels.service }} p95 latency above 1.5s"
          description: "{{ $labels.service }} p95 latency is {{ $value }}s over the last 5 minutes."

      - alert: ServiceUnavailable
        expr: up{service="payments-api"} == 0 or up{service="orders-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is down"
