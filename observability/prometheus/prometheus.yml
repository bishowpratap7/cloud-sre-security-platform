global:
  scrape_interval: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: payments-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payments-api:8080"]
        labels:
          service: payments-api

  - job_name: orders-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orders-api:8080"]
        labels:
          service: orders-api

  - job_name: incident-engine
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["incident-engine:8080"]
        labels:
          service: incident-engine

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]
