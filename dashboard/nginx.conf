server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck for the container (docker/k8s)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # --- API proxying (same-origin so the browser needs no CORS) ----
    # Incident engine
    location /api/incidents {
        rewrite ^/api/incidents(/.*)?$ /incidents$1 break;
        proxy_pass http://incident-engine:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
    location /api/services {
        rewrite ^/api/services(/.*)?$ /services$1 break;
        proxy_pass http://incident-engine:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
    # payments-api (faults + traffic)
    location /api/faults {
        rewrite ^/api/faults(/.*)?$ /faults$1 break;
        proxy_pass http://payments-api:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /api/payments {
        rewrite ^/api/payments(/.*)?$ /payments$1 break;
        proxy_pass http://payments-api:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
