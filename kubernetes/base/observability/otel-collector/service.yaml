apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: sre-platform
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: observability
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 9464
      targetPort: metrics
  type: ClusterIP
