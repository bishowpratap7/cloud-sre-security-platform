name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/sre-platform

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build backend (Java 21)
        run: mvn -f services/pom.xml -B -ntp verify

      - name: Build dashboard (Vite + TS)
        run: |
          cd dashboard
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            services/payments-api/target/*.jar
            services/orders-api/target/*.jar
            services/incident-engine/target/*.jar
          if-no-files-found: error

  security:
    name: Security scans
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: semgrep-sast
          - name: trivy-fs-deps
          - name: trivy-iac
    steps:
      - uses: actions/checkout@v4

      - name: SAST with Semgrep
        if: matrix.name == 'semgrep-sast'
        uses: returntocorp/semgrep-action@v1
        with:
          publish_token: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Install Trivy
        if: matrix.name != 'semgrep-sast'
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Dependency + filesystem scan
        if: matrix.name == 'trivy-fs-deps'
        run: trivy fs --scanners vuln,secret,license --severity HIGH,CRITICAL --exit-code 1 .
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db

      - name: IaC / config scan
        if: matrix.name == 'trivy-iac'
        run: trivy config --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 \
             kubernetes/ terraform/ docker-compose.yml

  build-and-push:
    name: Build images
    needs: security
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [payments-api, orders-api, incident-engine, dashboard]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'dashboard' && 'dashboard' || format('services/{0}', matrix.service) }}
          file: ${{ matrix.service == 'dashboard' && 'dashboard/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@v3
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-results.sarif

  deploy:
    name: Deploy to EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: azure/setup-kubectl@v4

      - name: kubeconfig
        run: aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name sre-platform --alias sre-platform

      - name: Render manifests
        run: |
          kubectl kustomize kubernetes/overlays/production > manifests.yaml
          sed -i "s#ghcr.io/sre-platform/#${{ env.IMAGE_BASE }}/#g" manifests.yaml
          sed -i "s#\(image: ${{ env.IMAGE_BASE }}/[^:]*\):latest#\1:${{ github.sha }}#" manifests.yaml

      - name: Apply
        run: |
          kubectl apply -f manifests.yaml
          kubectl -n sre-platform rollout status deployment/payments-api --timeout=180s
          kubectl -n sre-platform rollout status deployment/orders-api --timeout=180s
          kubectl -n sre-platform rollout status deployment/incident-engine --timeout=120s
